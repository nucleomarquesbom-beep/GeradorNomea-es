name: Atualizar índice FPF

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    name: Atualizar índice de clubes FPF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Atualizar índice FPF
        run: npm run fpf:index

      - name: Verificar alterações
        id: changes
        run: |
          if git diff --quiet -- data/fpf-clubs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e enviar índice atualizado
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fpf-clubs.json
          git commit -m "Atualizar índice de clubes FPF"
          git push

      - name: Índice já está atualizado
        if: steps.changes.outputs.changed == 'false'
        run: echo "Nenhuma alteração no índice FPF."
