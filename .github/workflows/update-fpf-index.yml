name: Atualizar índice FPF

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Atualizar índice FPF
        run: npm run fpf:index

      - name: Commit do índice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fpf-clubs.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no índice."
            exit 0
          fi

          git commit -m "Atualizar índice de clubes FPF"
          git push
